[package]
name = "inventaris_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
argon2 = "0.5"
dotenvy = "0.15.7"
jsonwebtoken = "9.3.1"
rand = "0.10.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "derive", "tls-rustls", "rust_decimal"] }
tokio = { version = "1.53.2", features = ["full"] }
